
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CadastroHub | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="card cadastro-card">

            <div class="logo">Cadastro<span>Hub.</span></div>

            <h1>Crie sua conta</h1>
            <p class="subtitulo">Preencha seus dados para começar.</p>

            <form id="formCadastro">

                <div class="grid-form">

                    <div>
                        <label>Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div>
                        <label>Sobrenome</label>
                        <input type="text" id="sobrenome" required>
                    </div>

                    <div>
                        <label>CPF</label>
                        <input type="text" id="cpf"
                            placeholder="000.000.000-00" required>
                    </div>

                    <div>
                        <label>E-mail</label>
                        <input type="email" id="email" required>
                    </div>

                    <div>
                        <label>Senha</label>
                        <input type="password" id="senha"
                            minlength="6" required>
                    </div>

                    <div>
                        <label>Telefone</label>
                        <input type="tel" id="telefone"
                            placeholder="(00) 00000-0000" required>
                    </div>

                    <div>
                        <label>Rua</label>
                        <input type="text" id="rua" required>
                    </div>

                    <div>
                        <label>CEP</label>
                        <input type="text" id="cep"
                            placeholder="00000-000" required>
                    </div>

                    <div>
                        <label>Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>

                    <div>
                        <label>Estado</label>
                        <input type="text" id="estado"
                            placeholder="Ex.: SP" required>
                    </div>

                </div>

                <button type="submit">Criar minha conta</button>

            </form>

            <p class="rodape">
                Já possui uma conta?
                <a href="index.html">Voltar ao login</a>
            </p>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
